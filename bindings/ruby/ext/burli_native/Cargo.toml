[package]
name = "burli_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Ruby binding for burli"
repository = "https://github.com/paddor/burli"
license = "MIT"
publish = false

[lib]
name = "burli_native"
crate-type = ["cdylib"]

[dependencies]
burli = { version = "0.3.7", default-features = false, features = ["std"] }
rb-sys = "0.9.130"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
