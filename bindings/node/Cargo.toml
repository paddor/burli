[workspace]

[package]
name = "burli-node"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Node.js binding for burli"
repository = "https://github.com/paddor/burli"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
burli = { path = "../..", default-features = false, features = ["std"] }
napi = { version = "3.15.0", default-features = false, features = ["napi8"] }
napi-derive = "3.6.13"

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
