[workspace]

[package]
name = "burli-python"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Python binding for burli"
repository = "https://github.com/paddor/burli"
license = "MIT"
publish = false

[lib]
name = "_burli"
crate-type = ["cdylib"]

[dependencies]
burli = { path = "../..", default-features = false, features = ["std"] }
# Stable ABI: one wheel covers Python 3.9 and later.
pyo3 = { version = "0.30.1", features = ["abi3-py39", "extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
