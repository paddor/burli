[workspace]

[package]
name = "burli-dotnet"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Native library of the .NET binding for burli"
repository = "https://github.com/paddor/burli"
license = "MIT"
publish = false

[lib]
name = "burli_dotnet"
crate-type = ["cdylib"]

[dependencies]
burli = { path = "../../..", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
must_use_candidate = "allow"
