[package]
name = "burli-encode"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
description = "Brotli encoder for burli"
license = "MIT"
repository = "https://github.com/paddor/burli"
readme = "README.md"
categories = ["compression"]
keywords = ["brotli", "compression", "encoder"]
include = ["/src/**/*", "/README.md", "/CHANGELOG.md"]

[lints]
workspace = true

[features]
default = ["std"]
std = ["alloc", "burli-core/std"]
alloc = ["burli-core/alloc"]
nightly = ["burli-core/nightly"]
paranoid = ["burli-core/paranoid"]

[dependencies]
burli-core = { version = "0.3.0", path = "../core", default-features = false }

[dev-dependencies]
burli = { path = "../.." }
burli-decode = { path = "../decode" }
