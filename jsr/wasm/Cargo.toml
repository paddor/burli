[workspace]

[package]
name = "burli-wasm"
version = "0.3.1"
edition = "2024"
description = "WebAssembly bindings for burli"
repository = "https://github.com/paddor/burli"
license-file = "../../LICENSE"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
burli = { path = "../..", default-features = false, features = ["std"] }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
