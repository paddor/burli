[package]
name = "burli-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
burli = { path = ".." }
libfuzzer-sys = "0.4"
rust-brotli = { package = "brotli", version = "8.0.4" }

[[bin]]
name = "burli-decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "burli-roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "burli-fragmented"
path = "fuzz_targets/fragmented.rs"
test = false
doc = false
bench = false
