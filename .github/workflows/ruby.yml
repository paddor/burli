name: ruby

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/ruby.yml"
      - "Cargo.toml"
      - "bindings/ruby/**"
      - "crates/**"
      - "src/**"

jobs:
  test:
    name: rake (${{ matrix.os }}, Ruby ${{ matrix.ruby }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.3", "4.0"]
        include:
          - os: ubuntu-latest
            ruby: truffleruby
    defaults:
      run:
        working-directory: bindings/ruby
    steps:
      - uses: actions/checkout@v4
      # Test the code the gems ship, built without the repo CPU tuning.
      - name: Disable local Cargo configuration
        shell: bash
        run: rm -f ../../.cargo/config.toml
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: bindings/ruby
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: bundle exec rake
      # The source gem builds against burli from crates.io.
      - name: Check source gem
        if: matrix.os == 'ubuntu-latest'
        run: |
          bundle exec rake build
          gem install pkg/burli-*.gem --install-dir "$RUNNER_TEMP/gems" --no-document
          GEM_HOME="$RUNNER_TEMP/gems" GEM_PATH="$RUNNER_TEMP/gems" ruby -e '
            gem "burli"
            require "burli"
            raise "round trip" unless Burli.inflate(Burli.deflate("x" * 1000)) == "x" * 1000'
